[project]
name = "guardian-compliance-mcp"
version = "0.3.0"
description = "Guardian Compliance MCP: Australian insurance regulatory compliance (APRA, ASIC, OAIC, Codes of Practice) for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp<2",
    "pydantic>=2.14.1",
]

[project.scripts]
guardian-compliance-mcp = "src.server:mcp.run"
apra-mcp = "src.server:mcp.run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
